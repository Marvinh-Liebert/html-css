<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebra de linha</h1>
    <hr>
    <p>Você pode escrever
        um parágrafo de
        qualquer jeito.
        Basta colocar tudo
        no meio do par de tags
        &lt;p&gt; e &lt;/p&gt; <!--(&lt = < e &gt = <)-->
    <p>Se quiser quebrar
        o texto em algum lugar específico <br>
        Utilize a tag br.
    </p>
    <p>Vamos adicionar alguns simbolos:
        &reg;
        &copy;
    </p>
    <p>Emojis:
        &#x1F601;
        &#x1F921;
    </p>
</body>
</html>
