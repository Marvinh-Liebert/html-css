<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            padding-left: 15px;
            padding-right: 15px;
        }
    </style>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imas"><label for="imas">Masculino</label>
            <input type="radio" name="sexo" id="ifem"><label for="ifem">Feminino</label>
            <input type="radio" name="sexo" id="itd"><label for="itd">Todo dia</label>
            <input type="radio" name="sexo" id="in"><label for="in">Nunca</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
            <input type="checkbox" name="esvol" id="iesvol"> <label for="iesvol">Volei</label>
            <input type="checkbox" name="espin" id="iespin"> <label for="iespin">Ping-Pong</label>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Baquete</label>
        </fieldset>
        <fieldset>
            <legend>Dados</legend>
            <label for="iemail">Email</label>
            <input type="email" name="email" id="iemail" placeholder="Meu-email@gmail.com">
        </fieldset>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
