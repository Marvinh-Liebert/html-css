<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            text-align: center;
        }
    </style>
</head>
<body>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="iusu"></label>
            <input type="text" name="usu" id="iusu" required maxlength="15" size="15" placeholder="Nome usuário" autocomplete="username">
        </p>
        <p>
            <label for="isenha"></label>
            <input type="password" name="sen" id="isenha" required minlength="8" maxlength="12" size="12" placeholder="Senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="apagar">
        </p>
    </form>
</body>
</html>
