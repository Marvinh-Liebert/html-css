<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Digite o horário de agora logo abaixo:</h1>
    <input type="number" name="hora" id="hora">
    <input type="button" value="enviar" onclick="ola()">
    <h1 id="res"></h1>


    <script>
        function ola(){
            var h = window.document.getElementById('hora')
            var hora = Number(h.value)
            var res = window.document.getElementById('res')

            if (hora < 12){
                res.innerHTML = "Bom dia!"
            } else if (hora <= 18){
                res.innerHTML = "Boa tarde!"
            } else {
                res.innerHTML = "Boa noite!"
            }
        }
    </script>
</body>
</html>
