<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade Machine</h1>
    </header>


    <main>
        <section class="ficha">
            
        <form >
            <div>
                <label for="txtano">Ano de nascimento: </label>
                <input type="number" name="txtano" id="txtano">
            </div>

            <div>
                <span>Sexo:</span>
                <input type="radio" name="sexo" id="masc" checked>
                <label for="masc">Masculino</label>
                
                <input type="radio" name="sexo" id="fem">
                <label for="fem">Feminino</label>
            </div>

            <div>
                <input type="submit" value="verificar" onclick="verif()">
            </div>
            </form>
            
        </section>

        
        <section class="ficha">
            <div id="res">
                <p>preencha os dados acima para ver o resultado!</p>
            </div>
        </section>
    </main>


    <footer>

    </footer>

    <script src="script.js"></script>
</body>
</html>
